services:
  - type: web
    name: meetbrief-ai
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: meetbrief
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: TRANSCRIPTION_API_URL
        sync: false
      - key: TRANSCRIPTION_API_KEY
        sync: false
      - key: TRANSCRIPTION_MODEL
        value: whisper-1
      - key: TRANSCRIPTION_TIMEOUT_MS
        value: 600000
      - key: GEMMA_API_URL
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma3:27b
      - key: GEMMA_TIMEOUT_MS
        value: 180000
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: MAX_UPLOAD_MB
        value: 60
